easure — and then to automate everything that repeated.","Today I connect three worlds that rarely talk to each other: marketing, data and AI. I configure, connect and measure — on your accounts, with your tools."],briefLabel:"IN SHORT",brief:["Based in Paris · remote engagements","Four languages EN · FR · ES · PT","Growth × Data × Automation"]},expertise:{label:"WHAT I DO",title:"Not one specialism — a complete system.",items:[{num:"01",title:"Acquisition",body:"Meta Ads, Google Ads, SEO and landing pages that convert — in English, French and Spanish."},{num:"02",title:"Growth & Outbound",body:"Tooled outbound prospecting: Apollo, Clay, Lemlist, Phantombuster, multichannel sequences."},{num:"03",title:"Data & Reporting",body:"GA4, GTM, Power BI, Tableau: tracking that holds up and dashboards you can decide from."},{num:"04",title:"AI & Automation",body:"Claude, N8N, Zapier, Make: repetitive tasks out of your team's day."}]},skills:{groups:[{name:"Prospecting",items:["Apollo.io","Clay","Lemlist","Phantombuster","Sales Navigator","Web scraping (Python)"]},{name:"Automation",items:["N8N","Make","Zapier","CRM & workflows","Data enrichment"]},{name:"Data",items:["Power BI","Tableau","GA4 & GTM","Python / SQL","Advanced Excel"]},{name:"AI",items:["Claude","ChatGPT","Prompt engineering"]},{name:"Ads",items:["Meta Ads","Google Ads","TikTok Ads","Canva"]}]},segments:{label:"WHO IT'S FOR",title:"Three situations where I move the needle most.",lead:"I don't work with everyone. If you recognise yourself in one of these three, we'll move fast.",items:[{num:"01",title:"Your outbound depends on people searching by hand",body:"Your sales team spends more time building lists than selling. The CRM piles up duplicates, follow-ups get lost, and nobody knows which message works. You're considering hiring an SDR — a system costs less and never resigns.",tags:["B2B agencies","Consultancies","10-60 staff"]},{num:"02",title:"You spend on ads without knowing what's profitable",body:"Acquisition cost is climbing, tracking has been broken since the consent updates, and your agency's reports don't answer the only question that matters: is this making money? Fix the data before raising budgets.",tags:["E-commerce","DTC brands","15-80 staff"]},{num:"03",title:"Your processes still run on spreadsheets and manual work",body:"Someone on your team copies data between tools that don't talk to each other, 5 to 10 hours a week. That's not a motivation problem, it's a plumbing problem. It gets automated in two weeks.",tags:["Service SMEs","Industrial","20-150 staff"]}]},offers:{label:"SERVICES & PRICING",title:"Fixed scope, prices in the open.",lead:"No endless quotes, no vague packages. Every service has a written scope, a duration and a price. You start with the diagnostic — it decides what comes next, with numbers on the table.",deducted:"Deducted from the total if we carry on together",included:"What you get",cta:"Book a call",dayRate:{label:"Outside the packages",value:"€450 / day",note:"For a one-off need, team backup or à la carte support. ES / PT / BR / AO markets: €320 / day."},items:[{num:"01",name:"Acquisition Diagnostic 360",price:"€690",duration:"5 working days",pitch:"The starting point for every engagement. You'll know exactly where your acquisition budget goes, what's being done by hand for no reason, and what to do over the next 90 days.",bullets:["A map of your real acquisition funnel, with the numbers finally consolidated","The 3 leaks costing you most, estimated in euros","Stack audit: what you pay for and don't use, what can be automated","A 90-day action plan prioritised by impact and effort","45-minute findings session, with your team if you want"],featured:!0},{num:"02",name:"B2B Pipeline Sprint",price:"€2,900",duration:"3 weeks",pitch:"The outbound machine, built end to end and delivered inside your own accounts. You own it outright — this isn't a service you have to re-buy from me every month.",bullets:["ICP definition, scoring, and a base of 1,500 to 3,000 qualified prospects","Multichannel sequences written and tested (email + LinkedIn)","Sending infrastructure: dedicated domains, warm-up, SPF / DKIM / DMARC","Continuous enrichment, deduplication and scoring workflow","Tracking dashboard + 2 hours of training and handover documentation"]},{num:"03",name:"Custom Automation & AI",price:"€1,900",duration:"2 weeks",pitch:"Your three most expensive manual processes, gone. Reporting, database enrichment, inbound lead qualification, tool syncing, content generation.",bullets:["Map of manual tasks with the lost hours quantified","3 automations shipped to production in your own accounts","Connects the tools you already use — no forced migration","Documentation and knowledge transfer to your team","Hours saved per week, measured before and after"]},{num:"04",name:"Growth System — retainer",price:"€1,400 / month",duration:"3-month commitment",pitch:"4 days a month running your acquisition over time: always-on campaigns, optimisation, system maintenance and decisions backed by data.",bullets:["Outbound campaigns run and optimised continuously","Paid campaign management and budget arbitration","Maintenance and evolution of your automations","Monthly reporting with decisions, not just charts","A 30-minute weekly check-in, direct access in between"]}]},method:{label:"METHOD",title:"I diagnose before I deliver.",lead:"No engagement starts with a tool recommendation. It starts with your data, your real numbers, and the problem behind the request.",steps:[{num:"01",title:"Understand",body:"The business, the market, and the real problem — usually not the one stated."},{num:"02",title:"Analyse",body:"Available data, friction points, and the opportunities left on the table."},{num:"03",title:"Build",body:"Strategy, campaigns and systems — in your accounts, under your name."},{num:"04",title:"Test",body:"Fast, against written hypotheses, without waiting for the perfect version."},{num:"05",title:"Optimise",body:"Measure, learn, iterate. Data decides, not opinion."}],quote:"I configure, connect and measure the tools instead of just recommending them."},proof:{label:"PROOF",title:"Tools in production, not slides.",lead:"I build the tools I use for my clients. Everything below is live and needs no installation — try it before you talk to me.",items:[{kind:"LIVE DEMO",title:"Ad Creative Doctor",body:"Multi-platform ad diagnostic scanner (Meta, Google, TikTok, Pinterest, Snapchat, LinkedIn): creative health score, ad fatigue detection and concrete recommendations.",tags:["React","Multi-platform","Ad diagnostics"],href:"https://creatives-checker.preview.emergentagent.com/",linkLabel:"Open the demo"},{kind:"LIVE DEMO",title:"Ad Library Scraper",body:"Turns a manual prospect search into a usable list in minutes: queries the Meta Ad Library by keyword and industry, extracts active advertisers and exports a prioritised CSV.",tags:["Python","Meta Ad Library","Prospecting"],href:"https://xs3aoohigd7j6.kimi.page/",linkLabel:"Open the demo"},{kind:"LIVE DEMO",title:"VeilleBlog",body:"Multi-source news monitoring that automatically generates illustrated, publish-ready blog articles — so you can keep a content rhythm without losing your days to it.",tags:["Automation","AI","Content"],href:"https://c7vju6fjvtpnm.kimi.pro/",linkLabel:"Open the demo"},{kind:"CASE STUDY",title:"B2B lead generation engine — European Sales Group",body:"Full rebuild of a B2B agency's outbound engine with Apollo, Clay and Lemlist: targeting, enrichment, sequences, then handover to their internal team. Documented end to end.",tags:["Apollo","Clay","Lemlist"],href:"https://dorcas-n.github.io/dorcas-ndembo.portfolio/",linkLabel:"Read the case study"},{kind:"CASE STUDY",title:"CRM automation pipeline",body:"An N8N pipeline that deduplicates, enriches and scores leads continuously — the end of manual data entry and rotting databases.",tags:["N8N","CRM","Data enrichment"],href:"https://dorcas-n.github.io/dorcas-ndembo.portfolio/",linkLabel:"Read the case study"},{kind:"CLIENT PROJECT",title:"ZenLabe — B2B positioning",body:"Turning a wellness innovation into a B2B commercial opportunity: positioning, messaging and a Webflow landing page built to generate conversations rather than to look good.",tags:["Webflow","B2B positioning","Landing page"],href:"https://dorcas-n.github.io/dorcas-ndembo.portfolio/",linkLabel:"View the project"}]},faq:{label:"FAQ",title:"What you're probably wondering.",items:[{q:"Why is the diagnostic paid when others give it away?",a:"Because it isn't a sales meeting in disguise, it's a deliverable: five days of work on your data and a 90-day plan you can execute with or without me. And if we carry on together, the €690 is deducted from the engagement — so you pay nothing extra."},{q:"How long until we see results?",a:"The diagnostic gives answers in 5 days. An outbound system is live in 3 weeks, with first meetings typically landing within the month after launch — that's domain warm-up time, which can't be rushed. An automation saves time from week 2."},{q:"Do we keep the tools and the data at the end?",a:"Yes. Everything is built in your accounts, under your name, and documented so your team can take over. Nothing is locked to me: it's your system, not a subscription in disguise."},{q:"Which markets and languages do you work in?",a:"France, Spain, Portugal, Brazil and Angola. I work in English, French, Spanish and Portuguese — sequences are written in the prospect's language, not machine-translated. On Iberian and Portuguese-speaking markets, that's often the whole difference."},{q:"What about GDPR compliance and deliverability?",a:"B2B outreach on a legitimate interest basis, with an opt-out notice, one-click unsubscribe and a request log. On the technical side: dedicated outreach domains so your main domain is never burned, SPF / DKIM / DMARC configured, gradual warm-up and per-mailbox sending caps."},{q:"You're a freelancer — what if you're no longer available?",a:"Every deliverable is documented so it can be picked up without me, and I deliberately cap myself at two engagements in parallel so nothing ships half-finished. Handover documentation is part of the scope, not an add-on."},{q:"How does a project actually start?",a:"A quote with the scope in writing, 40% on order and the balance on delivery. Then: tool access, a 45-minute kick-off to validate the ICP and the messaging, and a shared plan where you track progress. Day one of work happens within a week of signing."},{q:"Are tool licences included in the price?",a:"No, and that's deliberate: subscriptions stay in your name so you keep the accounts. Budget €150–300 / month depending on volume (prospect database, sending tool, enrichment). I tell you exactly what to buy, what is a waste, and I work with the tools you already own first."},{q:"How much of my own time does it take?",a:"2–3 hours at the start — access, ICP and messaging sign-off — then 30 minutes a week to make calls. Everything else is my job: if a project needs more of your time than that, it's badly scoped."},{q:"What if the results don't come?",a:"I don't promise numbers I don't control. Every engagement starts from written assumptions and KPIs we set together; we review them weekly and fix targeting or messaging. The monthly retainer ends when the 3 months end — no automatic renewal."},{q:"Do you replace my agency or my in-house team?",a:"No. I fix the data and the plumbing so your agency and your team work off numbers they can trust. On most engagements I work alongside a media agency that's already in place — and I give you the questions you should be asking them."}]},contact:{label:"CONTACT",title:"One 30-minute call and you'll know if it's worth it.",lead:"No sales pitch. You tell me how you win clients today, I tell you what I'd do, with what budget and in what order. If it's not a fit, I'll say so before we hang up.",cta:"Book 30 min",emailLabel:"Email",phoneLabel:"Phone",linkedinLabel:"LinkedIn",portfolioLabel:"Full portfolio"},footer:"Growth Marketing × AI × Data · Paris, France"},sT={meta:{title:"Dorcas Ndembo · Servicios y tarifas — Growth, Data y Automatización",description:"Sistemas de captación B2B para pymes: prospección automatizada, tracking fiable y automatizaciones con IA. Alcance y precios publicados, desde 690 €."},nav:{about:"Sobre mí",offers:"Servicios",method:"Método",proof:"Pruebas",faq:"FAQ",cta:"Reservar una llamada"},hero:{status:"Disponible · máximo 2 proyectos en paralelo",kicker:"GROWTH · DATA · AUTOMATIZACIÓN · IA",titleTop:"Vuestra captación,",titleBottom:"en piloto automático.",lead:"Construyo sistemas que encuentran a vuestros clientes potenciales, los cualifican y llenan vuestro pipeline B2B — sin contratar, sin agencia y sin que vuestro equipo pierda el día en ello. Alcance claro, precios publicados, y todo queda en vuestras manos.",ctaPrimary:"Reservar 30 min",ctaSecondary:"Ver los servicios",location:"París · proyectos en remoto",stats:[{value:"5 días",label:"para un diagnóstico completo"},{value:"3 semanas",label:"para un sistema de prospección entregado"},{value:"4 idiomas",label:"ES · FR · PT · EN"}]},about:{label:"SOBRE MÍ",title:"Marketera por elección, técnica por curiosidad.",body:["Nacida en España, criada entre España y Francia, con un año en Inglaterra: aprendí muy pronto a cambiar de idioma y de contexto. Se convirtió en una herramienta de trabajo antes que en una línea del CV.","Llegué al marketing por la comunicación y las ventas, y después por los datos: de tanto querer saber qué funcionaba de verdad, aprendí a medir — y luego a automatizar todo lo que se repetía.","Hoy conecto tres mundos que se hablan poco: el marketing, los datos y la IA. Configuro, conecto y mido, en vuestras cuentas y con vuestras herramientas."],briefLabel:"EN RESUMEN",brief:["Basada en París · proyectos en remoto","Cuatro idiomas ES · FR · EN · PT","Growth × Data × Automatización"]},expertise:{label:"LO QUE HAGO",title:"No una especialid aja en un clic y registro de solicitudes. En lo técnico: dominios dedicados a la prospección para no quemar nunca vuestro dominio principal, SPF / DKIM / DMARC configurados, warm-up progresivo y límites de envío por buzón."},{q:"Sois freelance — ¿qué pasa si dejáis de estar disponible?",a:"Cada entregable está documentado para poder continuar sin mí, y limito deliberadamente a dos proyectos en paralelo para no entregar nada a medias. La documentación de traspaso forma parte del alcance, no es un extra."},{q:"¿Cómo empieza el proyecto, en concreto?",a:"Un presupuesto con el alcance por escrito, 40 % al inicio y el resto a la entrega. Después: accesos a las herramientas, kick-off de 45 min para validar el ICP y el discurso, y un plan compartido donde veis el avance. El primer día de trabajo llega en menos de una semana tras la firma."},{q:"¿Las licencias de herramientas están incluidas en el precio?",a:"No, y es deliberado: las suscripciones quedan a vuestro nombre para que conservéis las cuentas. Calculad 150 a 300 € / mes según el volumen (base de prospectos, herramienta de envío, enriquecimiento). Os digo exactamente qué contratar, qué no sirve, y priorizo las herramientas que ya tenéis."},{q:"¿Cuánto tiempo me ocupa por mi parte?",a:"2 o 3 horas al arrancar — accesos, validación del ICP y del mensaje — y luego 30 minutos por semana para decidir. El resto es mi trabajo: si un proyecto exige más de vuestro tiempo, está mal planteado."},{q:"¿Y si los resultados no llegan?",a:"No prometo cifras que no controlo. Cada proyecto arranca con hipótesis escritas y KPI definidos juntos; los revisamos cada semana y corregimos segmentación o mensaje. El acompañamiento mensual termina al cerrar los 3 meses, sin renovación automática."},{q:"¿Sustituís a mi agencia o a mi equipo actual?",a:"No. Pongo en orden los datos y la fontanería técnica para que vuestra agencia y vuestro equipo trabajen con cifras fiables. En la mayoría de los proyectos trabajo junto a una agencia de medios ya contratada — y os doy las preguntas que deberíais hacerle."}]},contact:{label:"CONTACTO",title:"Una llamada de 30 minutos y sabréis si merece la pena.",lead:"Sin presentación comercial. Me contáis cómo conseguís clientes hoy y yo os digo qué haría, con qué presupuesto y en qué orden. Si no es para mí, os lo digo al final de la llamada.",cta:"Reservar 30 min",emailLabel:"Email",phoneLabel:"Teléfono",linkedinLabel:"LinkedIn",portfolioLabel:"Portfolio completo"},footer:"Growth Marketing × IA × Data · París, Francia"},iT={meta:{title:"Dorcas Ndembo · Offres & tarifs — Growth, Data & Automatisation",description:"Systèmes d'acquisition B2B pour PME : prospection automatisée, tracking fiable, automatisations IA. Offres et tarifs affichés, à partir de 690 €."},nav:{about:"À propos",offers:"Offres",method:"Méthode",proof:"Preuves",faq:"FAQ",cta:"Réserver un appel"},hero:{status:"Disponible · 2 missions maximum en parallèle",kicker:"GROWTH · DATA · AUTOMATISATION · IA",titleTop:"Votre acquisition,",titleBottom:"en pilote automatique.",lead:"Je construis des systèmes qui trouvent vos prospects, les qualifient et remplissent votre pipeline B2B — sans recruter, sans agence, et sans que vos équipes y passent leurs journées. Périmètre clair, prix affichés, livrables qui vous appartiennent.",ctaPrimary:"Réserver 30 min",ctaSecondary:"Voir les offres",location:"Paris · missions à distance",stats:[{value:"5 jours",label:"pour un diagnostic complet"},{value:"3 semaines",label:"pour un système de prospection livré"},{value:"4 langues",label:"FR · ES · PT · EN"}]},about:{label:"À PROPOS",title:"Marketeuse par choix, technique par curiosité.",body:["Née en Espagne, grandie entre l'Espagne et la France, un an passé en Angleterre : j'ai appris très tôt à passer d'une langue et d'un contexte à l'autre. C'est devenu un outil de travail avant d'être une ligne sur un CV.","Je suis venue au marketing par la communication et la vente, puis par la donnée : à force de vouloir savoir ce qui marc nkLabel:"Ouvrir la démo"},{kind:"CASE STUDY",title:"Moteur de génération de leads B2B — European Sales Group",body:"Reconstruction complète du moteur d'acquisition sortante d'une agence B2B avec Apollo, Clay et Lemlist : ciblage, enrichissement, séquences, puis passation à l'équipe interne. Documenté de A à Z.",tags:["Apollo","Clay","Lemlist"],href:"https://dorcas-n.github.io/dorcas-ndembo.portfolio/",linkLabel:"Lire le case study"},{kind:"CASE STUDY",title:"Pipeline d'automatisation CRM",body:"Pipeline N8N qui dédoublonne, enrichit et score les leads en continu — la fin de la saisie manuelle et des bases de données qui pourrissent.",tags:["N8N","CRM","Data enrichment"],href:"https://dorcas-n.github.io/dorcas-ndembo.portfolio/",linkLabel:"Lire le case study"},{kind:"PROJET CLIENT",title:"ZenLabe — positionnement B2B",body:"Transformer une innovation bien-être en opportunité commerciale B2B : positionnement, message et landing page Webflow pensée pour la prise de contact plutôt que pour la vitrine.",tags:["Webflow","Positionnement B2B","Landing page"],href:"https://dorcas-n.github.io/dorcas-ndembo.portfolio/",linkLabel:"Voir le projet"}]},faq:{label:"FAQ",title:"Ce que vous vous demandez sûrement.",items:[{q:"Pourquoi le diagnostic est-il payant alors que d'autres l'offrent ?",a:"Parce que ce n'est pas un rendez-vous commercial déguisé, c'est un livrable : cinq jours de travail sur vos données, un plan à 90 jours que vous pouvez exécuter avec ou sans moi. Et si vous me confiez la suite, les 690 € sont déduits de la mission — vous ne payez donc rien de plus."},{q:"En combien de temps voit-on des résultats ?",a:"Le diagnostic donne des réponses en 5 jours. Un système de prospection est en production en 3 semaines, avec les premiers rendez-vous généralement dans le mois qui suit le lancement — le temps du warm-up des domaines, qui n'est pas compressible. Une automatisation fait gagner du temps dès la semaine 2."},{q:"Est-ce que je garde les outils et les données à la fin ?",a:"Oui, tout est construit sur vos comptes, à votre nom, et documenté pour que votre équipe reprenne la main. Je ne verrouille rien : c'est votre système, pas un abonnement déguisé."},{q:"Vous travaillez sur quels marchés et dans quelles langues ?",a:"France, Espagne, Portugal, Brésil et Angola. Je travaille en français, espagnol, portugais et anglais — les séquences de prospection sont rédigées dans la langue du prospect, pas traduites automatiquement. C'est souvent ce qui fait la différence sur les marchés ibériques et lusophones."},{q:"Et la conformité RGPD et la délivrabilité ?",a:"Prospection B2B sur base d'intérêt légitime, avec mention d'opposition, désinscription en un clic et registre des demandes. Côté technique : domaines dédiés à la prospection pour ne jamais brûler votre domaine principal, SPF / DKIM / DMARC configurés, warm-up progressif et plafonds d'envoi par boîte."},{q:"Vous êtes freelance — que se passe-t-il si vous n'êtes plus disponible ?",a:"Chaque livrable est documenté pour être repris sans moi, et je limite volontairement à deux missions en parallèle pour ne jamais livrer à moitié. La documentation de passation fait partie du périmètre, pas d'une option."},{q:"Comment se passe le démarrage, concrètement ?",a:"Un devis avec le périmètre écrit, 40 % à la commande et le solde à la livraison. Ensuite : accès aux outils, kick-off de 45 min pour valider l'ICP et le discours, et un planning partagé où vous voyez l'avancement. Le premier jour de travail intervient sous une semaine après signature."},{q:"Les licences d'outils sont-elles incluses dans le prix ?",a:"Non, et c'est volontaire : les abonnements restent à votre nom pour que vous gardiez les comptes. Comptez 150 à 300 € / mois selon le volume (base de prospects, outil d'envoi, enrichissement). Je vous dis exactement quoi prendre, ce qui ne sert à rien, et je travaille en priorité avec les outils que vous avez déjà."},{q:"Combien de temps ça me prend, de mon côté ?",a:"2 à 3 heures au démarrage — les accès, la validation de l'ICP et du discours — puis 30 minutes par semaine pour arbitrer. Au-delà, c'est mon travail : si un projet exige plus de votre temps, c'est qu'il est mal cadré."},{q:"Et si les résultats ne sont pas là ?",a:"Je ne promets pas de chiffres que je ne contrôle pas. Chaque mission démarre sur des hypothèses écrites et des KPI définis ensemble ; on les regarde chaque semaine et on corrige le ciblage ou le message. L'accompagnement mensuel s'arrête à la fin des 3 mois, sans reconduction automatique."},{q:"Vous remplacez mon agence ou mon équipe en place ?",a:"Non. Je remets la donnée et la plomberie d'aplomb pour que votre agence et votre équipe travaillent sur des chiffres fiables. Dans la plupart des missions, je travaille à côté d'une agence média déjà en place — et je vous donne les questions à lui poser."}]},contact:{label:"CONTACT",title:"Un appel de 30 minutes, et vous saurez si ça vaut le coup.",lead:"Pas de présentation commerciale. Vous me racontez comment vous trouvez vos clients aujourd'hui, je vous dis ce que je ferais, avec quel budget et dans quel ordre. Si ce n'est pas pour moi, je vous le dis en fin d'appel.",cta:"Réserver 30 min",emailLabel:"Email",phoneLabel:"Téléphone",linkedinLabel:"LinkedIn",portfolioLabel:"Portfolio complet"},footer:"Growth Marketing × IA × Data · Paris, France"},lT={meta:{title:"Dorcas Ndembo · Serviços e preços — Growth, Data e Automação",description:"Sistemas de aquisição B2B para PME: prospeção automatizada, tracking fiável e automações com IA. Âmbito e preços publicados, desde 690 €."},nav:{about:"Sobre mim",offers:"Serviços",method:"Método",proof:"Provas",faq:"FAQ",cta:"Marcar uma chamada"},hero:{status:"Disponível · máximo 2 projetos em paralelo",kicker:"GROWTH · DATA · AUTOMAÇÃO · IA",titleTop:"A vossa aquisição,",titleBottom:"em piloto automático.",lead:"Construo sistemas que encontram os vossos potenciais clientes, qualificam-nos e enchem o vosso pipeline B2B — sem contratar, sem agên das em dados.",bullets:["Campanhas outbound geridas e otimizadas em continuidade","Pilotagem e arbitragem das campanhas de publicidade","Manutenção e evolução das vossas automações","Relatório mensal com decisões, não apenas gráficos","Uma reunião de 30 min por semana e acesso direto entre reuniões"]}]},method:{label:"MÉTODO",title:"Diagnostico antes de entregar.",lead:"Nenhum projeto começa com a recomendação de uma ferramenta. Começa pelos vossos dados, pelos números reais e pelo problema que está por trás do pedido.",steps:[{num:"01",title:"Compreender",body:"O negócio, o mercado e o problema real — quase sempre diferente do que é pedido."},{num:"02",title:"Analisar",body:"Os dados disponíveis, as fricções e as oportunidades que ficam por aproveitar."},{num:"03",title:"Construir",body:"A estratégia, as campanhas e os sistemas, nas vossas contas e em vosso nome."},{num:"04",title:"Testar",body:"Depressa, sobre hipóteses escritas, sem esperar pela versão perfeita."},{num:"05",title:"Otimizar",body:"Medir, aprender, iterar. Quem decide é o dado, não a opinião."}],quote:"Configuro, ligo e meço as ferramentas em vez de me limitar a recomendá-las."},proof:{label:"PROVAS",title:"Ferramentas em produção, não slides.",lead:"Construo as ferramentas que uso com os meus clientes. Tudo o que segue está online e acessível sem instalar nada — experimentem antes de falar comigo.",items:[{kind:"DEMO ONLINE",title:"Ad Creative Doctor",body:"Scanner de diagnóstico publicitário multiplataforma (Meta, Google, TikTok, Pinterest, Snapchat, LinkedIn): score de saúde dos criativos, deteção de fadiga publicitária e recomendações concretas.",tags:["React","Multiplataforma","Diagnóstico ads"],href:"https://creatives-checker.preview.emergentagent.com/",linkLabel:"Abrir a demo"},{kind:"DEMO ONLINE",title:"Ad Library Scraper",body:"Transforma uma pesquisa manual de prospetos numa lista utilizável em minutos: consulta a Meta Ad Library por palavra-chave e setor, extrai os anunciantes ativos e exporta um CSV priorizado.",tags:["Python","Meta Ad Library","Prospeção"],href:"https://xs3aoohigd7j6.kimi.page/",linkLabel:"Abrir a demo"},{kind:"DEMO ONLINE",title:"VeilleBlog",body:"Monitorização de notícias multifonte que gera automaticamente artigos de blog ilustrados e prontos a publicar, para manter um ritmo de conteúdo sem gastar o dia nisso.",tags:["Automação","IA","Conteúdo"],href:"https://c7vju6fjvtpnm.kimi.pro/",linkLabel:"Abrir a demo"},{kind:"CASE STUDY",title:"Motor de geração de leads B2B — European Sales Group",body:"Reconstrução completa do motor de aquisição outbound de uma agência B2B com Apollo, Clay e Lemlist: segmentação, enriquecimento, sequências e passagem para a equipa interna. Documentado de ponta a ponta.",tags:["Apollo","Clay","Lemlist"],href:"https://dorcas-n.github.io/dorcas-ndembo.portfolio/",linkLabel:"Ler o case study"},{kind:"CASE STUDY",title:"Pipeline de automação de CRM",body:"Pipeline em N8N que deduplica, enriquece e pontua os leads em continuidade — o fim da introdução manual de dados e das bases que se degradam.",tags:["N8N","CRM","Data enrichment"],href:"https://dorcas-n.github.io/dorcas-ndembo.portfolio/",linkLabel:"Ler o case study"},{kind:"PROJETO CLIENTE",title:"ZenLabe — posicionamento B2B",body:"Transformar uma inovação de bem-estar em oportunidade comercial B2B: posicionamento, mensagem e landing page em Webflow pensada para gerar contactos, não para mostrar.",tags:["Webflow","Posicionamento B2B","Landing page"],href:"https://dorcas-n.github.io/dorcas-ndembo.portfolio/",linkLabel:"Ver o projeto"}]},faq:{label:"FAQ",title:"O que provavelmente estão a pensar.",items:[{q:"Porque é que o diagnóstico é pago se outros oferecem?",a:"Porque não é uma reunião comercial disfarçada, é um entregável: cinco dias de trabalho sobre os vossos dados e um plano a 90 dias que podem executar comigo ou sem mim. E se avançarmos juntos, os 690 € são descontados do projeto — não pagam nada a mais."},{q:"Em quanto tempo se vêem resultados?",a:"O diagnóstico dá respostas em 5 dias. Um sistema de prospeção fica em produção em 3 semanas, e as primeiras reuniões costumam surgir no mês seguinte ao lançamento — o tempo do warm-up dos domínios, que não se pode acelerar. Uma automação poupa tempo já na semana 2."},{q:"Ficamos com as ferramentas e os dados no fim?",a:"Sim. Tudo é construído nas vossas contas, em vosso nome e documentado para que a vossa equipa assuma o controlo. Não bloqueio nada: é o vosso sistema, não uma subscrição disfarçada."},{q:"Em que mercados e idiomas trabalha?",a:"França, Espanha, Portugal, Brasil e Angola. Trabalho em português, francês, espanhol e inglês — as sequências são escritas na língua do prospeto, não traduzidas automaticamente. É muitas vezes isso que faz a diferença nos mercados ibéricos e lusófonos."},{q:"E o cumprimento do RGPD e a entregabilidade?",a:"Prospeção B2B com base em interesse legítimo, com menção de oposição, cancelamento num clique e registo dos pedidos. Do lado técnico: domínios dedicados à prospeção para nunca queimar o vosso domínio principal, SPF / DKIM / DMARC configurados, warm-up progressivo e limites de envio por caixa."},{q:"É freelancer — o que acontece se deixar de estar disponível?",a:"Cada entregável está documentado para poder continuar sem mim, e limito deliberadamente a dois projetos em paralelo para nunca entregar nada a meio. A documentação de passagem faz parte do âmbito, não é um extra."},{q:"Como começa o projeto, concretamente?",a:"Um orçamento com o âmbito por escrito, 40 % na encomenda e o restante na entrega. Depois: acessos às ferramentas, kick-off de 45 min para validar o ICP e a mensagem, e um plano partilhado onde acompanham o avanço. O primeiro dia de trabalho acontece menos de uma semana após a assinatura."},{q:"As licenças das ferramentas estão incluídas no preço?",a:"Não, e é intencional: as subscrições ficam em vosso nome para que mantenham as contas. Contem com 150 a 300 € / mês conforme o volume (base de prospetos, ferramenta de envio, enriquecimento). Digo-vos exatamente o que contratar, o que não serve, e privilegio as ferramentas que já têm."},{q:"Quanto tempo me ocupa do meu lado?",a:"2 a 3 horas no arranque — acessos, validação do ICP e da mensagem — e depois 30 minutos por semana para decidir. O resto é o meu trabalho: se um projeto exige mais do vosso tempo, está mal enquadrado."},{q:"E se os resultados não aparecerem?",a:"Não prometo números que não controlo. Cada projeto arranca com hipóteses escritas e KPI definidos em conjunto; revemo-los cada semana e corrigimos segmentação ou mensagem. O acompanhamento mensal termina no fim dos 3 meses, sem renovação automática."},{q:"Substitui a minha agência ou a minha equipa atual?",a:"Não. Coloco os dados e a parte técnica em ordem para que a vossa agência e a vossa equipa trabalhem com números fiáveis. Na maioria dos projetos trabalho ao lado de uma agência de meios já contratada — e dou-vos as perguntas que lhe devem fazer."}]},contact:{label:"CONTACTO",title:"Uma chamada de 30 minutos e vão saber se vale a pena.",lead:"Sem apresentação comercial. Contam-me como conseguem clientes hoje e eu digo o que faria, com que orçamento e em que ordem. Se não for para mim, digo-vos no fim da chamada.",cta:"Marcar 30 min",emailLabel:"Email",phoneLabel:"Telefone",linkedinLabel:"LinkedIn",portfolioLabel:"Portfólio completo"},footer:"Growth Marketing × IA × Data · Paris, França"},rT={fr:iT,es:sT,pt:lT,en:oT},y1=["fr","es","pt","en"],b1="dn-locale";function qm(s){return s!==null&&y1.includes(s)}function uT(){if(typeof window>"u")return"fr";const s=new URLSearchParams(window.location.search).get("lang");if(qm(s))return s;const l=window.localStorage.getItem(b1);if(qm(l))return l;const u=window.navigator.language.slice(0,2).toLowerCase();return qm(u)?u:"fr"}const v1=V.createContext(null);function cT({children:s}){const[l,u]=V.useState("fr");V.useEffect(()=>{u(uT())},[]);const d=V.useCallback(y=>{u(y),window.localStorage.setItem(b1,y)},[]),m=rT[l];V.
